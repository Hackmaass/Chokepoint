name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      falkordb:
        image: falkordb/falkordb:v4.22.0
        ports: ["6379:6379"]
        env:
          REDIS_ARGS: "--requirepass ci-password"
    env:
      FALKORDB_HOST: 127.0.0.1
      FALKORDB_PORT: "6379"
      FALKORDB_PASSWORD: ci-password
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check src tests scripts
      # Tests that need the 4.5 M-transfer dataset skip themselves when it is absent; the solver oracle tests,
      # the database gates and the agent-loop tests run here.
      - run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b
      - run: npm run build
