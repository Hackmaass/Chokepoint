# FalkorDB for Chokepoint. Image pinned by digest (v4.22.0, full image incl. Browser).
# Needs FALKORDB_PASSWORD in the environment or in a git-ignored .env file next to this file.
services:
  falkordb:
    image: falkordb/falkordb:v4.22.0@sha256:4ac83f55062d364dcf151692635138b0bd2e12578019a56eb86ef53d067b116b
    container_name: chokepoint-falkordb
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"   # database (localhost only)
      - "127.0.0.1:3000:3000"   # FalkorDB Browser (localhost only)
    environment:
      # The image default is "MAX_QUEUED_QUERIES 25 TIMEOUT 1000 RESULTSET_SIZE 10000".
      # RESULTSET_SIZE silently truncates results, so it is raised and the app asserts row counts.
      # TIMEOUT_DEFAULT is short on purpose: algo.maxFlow ignores per-query timeouts and can hang on
      # some node-split networks, so the server-side default is what bounds it (it cancels cleanly).
      FALKORDB_ARGS: "MAX_QUEUED_QUERIES 50 TIMEOUT_MAX 60000 TIMEOUT_DEFAULT 3000 RESULTSET_SIZE 1000000"
      # RDB snapshots are off: the append-only file already persists the data, and a background save blocks
      # GRAPH.COPY (it needs a fork) for as long as it runs.
      REDISCLI_AUTH: ${FALKORDB_PASSWORD:?set FALKORDB_PASSWORD}   # lets the healthcheck's redis-cli authenticate
      REDIS_ARGS: "--requirepass ${FALKORDB_PASSWORD:?set FALKORDB_PASSWORD} --appendonly yes --save \"\""
    volumes:
      - falkordb_data:/var/lib/falkordb/data
    # Healthy only when the database answers PING, which it does not while it is still loading the graph from disk
    # (about a minute for the full dataset). The app and the seed job wait for this.
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s

  # The app (API + built web UI). Start with:  docker compose --profile app up -d --build
  api:
    profiles: ["app"]
    build: .
    container_name: chokepoint-api
    restart: unless-stopped
    depends_on:
      falkordb:
        condition: service_healthy
    environment:
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
      FALKORDB_PASSWORD: ${FALKORDB_PASSWORD:?set FALKORDB_PASSWORD}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      LLM_RPM_LIMIT: ${LLM_RPM_LIMIT:-30}
      DEMO_MODE: ${DEMO_MODE:-1}   # set 0 on a public host: the demo endpoints edit the graph
      TRUST_PROXY: ${TRUST_PROXY:-0}   # 1 behind Caddy or nginx, so rate limits see the real client address
      CORS_ORIGINS: ${CORS_ORIGINS:-}   # only needed for a UI served from another origin
    ports:
      - "127.0.0.1:8080:8000"   # put a TLS reverse proxy (Caddy, nginx) in front for a public deployment

  # One-off data load:  docker compose --profile seed run --rm seed
  seed:
    profiles: ["seed"]
    build: .
    depends_on:
      falkordb:
        condition: service_healthy
    healthcheck:
      disable: true   # the image's HTTP healthcheck is for the API, not for this one-off job
    environment:
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
      FALKORDB_PASSWORD: ${FALKORDB_PASSWORD:?set FALKORDB_PASSWORD}
    volumes:
      - dataset:/app/data
    working_dir: /app
    command: ["sh", "-c", "python scripts/download_data.py && python scripts/load_ibm.py"]

volumes:
  falkordb_data:
  dataset:
