[project]
name = "chokepoint"
version = "0.1.0"
description = "Chokepoint: a collateral-aware freeze-plan agent on FalkorDB (Graph Hacks 2026, Track 1)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "falkordb>=1.0",
  "networkx>=3.3",
  "polars>=1.0",
  "httpx>=0.27",
  "fastapi>=0.143.1",
  "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "hypothesis>=6",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chokepoint"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "db: needs a running FalkorDB (docker compose up -d falkordb)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
